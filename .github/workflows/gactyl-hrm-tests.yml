name: Gactyl HRM timeline tests
on:
  push:
    branches: [hrm-timeline-tests, hrm-toggle-tests]
jobs:
  hrm:
    runs-on: ubuntu-latest
    container:
      image: docker.io/zmkfirmware/zmk-build-arm:3.5
    steps:
      - uses: actions/checkout@v4
      - run: west init -l app
      - run: west update --fetch-opt=--filter=tree:0
      - run: west zephyr-export
      - name: Upstream hold-tap regression tests (patch must not change them)
        working-directory: app
        run: |
          rc=0
          for f in balanced tap-preferred hold-preferred tap-unless-interrupted hold-while-undecided; do
            west test tests/hold-tap/$f > /tmp/up-$f.out 2>&1 || rc=1
            echo "$f: $(grep -c '^PASS' /tmp/up-$f.out) pass, $(grep -c '^FAILED' /tmp/up-$f.out) failed"
          done
          exit $rc
      - name: Gactyl timeline tests (hand-derived expected snapshots)
        working-directory: app
        run: |
          west test tests/hold-tap/gactyl-hrm > /tmp/hrm.out 2>&1; rc=$?
          echo "$(grep -c '^PASS' /tmp/hrm.out) pass, $(grep -c '^FAILED' /tmp/hrm.out) failed"
          grep -E "^(FAILED|[-+][^-+])" /tmp/hrm.out | head -60
          exit $rc
